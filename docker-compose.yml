services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pn_learn
    ports:
      - "127.0.0.1:${DB_PORT:-4134}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pn_learn"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/pn_learn
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  customer-portal:
    build:
      context: ./frontend/customer-chatbot-hr-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:${API_PORT:-8000}
        VITE_ADMIN_URL: http://localhost:5174
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  admin-panel:
    build:
      context: ./frontend/admin-panel
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:${API_PORT:-8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"

volumes:
  postgres_data:
    name: backend_postgres_data
    external: true
